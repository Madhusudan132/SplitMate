
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- App identity -->
    <title>SplitMate | Smart Bill Splitter</title>

    <meta
      name="description"
      content="SplitMate helps you scan restaurant receipts, split bills fairly, track expenses, and settle payments with friends."
    />

    <!-- Browser icons -->
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon.ico"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- iPhone and iPad home-screen icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <!-- PWA browser theme -->
    <meta
      name="theme-color"
      content="#FFD600"
    />

    <!-- iOS standalone app support -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
  name="mobile-web-app-capable"
  content="yes"
/>

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="SplitMate"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
